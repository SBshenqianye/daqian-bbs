# 大千智荟论坛 · 界面级 E2E 配置（改完直接保存，无需重新打包）
# 前端地址（末尾带 /），例如 http://10.0.0.10/bbs-user/
baseUrl=http://127.0.0.1:9081/bbs-user/

# 后端 API 地址（留空则按 baseUrl 推导：协议+主机+端口 + /bbs-server）
# WSL2：http://localhost:60001/bbs-server
apiBase=

# 无头模式：true=不弹浏览器窗口（适合服务器/批处理）；false=可看到点击过程
headless=true

# readonly=只读（生产验收推荐，不点会写数据的按钮）
# write=含点赞/评论等写操作（仅测试库/预发环境）
mode=readonly

# 验收账号（留空则跳过登录相关用例）
username=
password=

# 是否打开帖子详情：生产只读环境默认 false，避免浏览量 +1
# 若要在生产验证详情，建议填一篇专用测试帖的完整地址到 detail.url
detail.enabled=false
detail.url=

# chromedriver 路径（相对本目录或绝对路径）
driver.path=driver/chromedriver.exe

# Chrome 可执行文件；留空则使用系统默认安装的 Chrome
chrome.binary=

# 显式等待超时（秒）
timeout=20

# 是否截图（失败时一定会截；成功时按用例截图）
screenshot=true

# 负向自检（内置）：每次运行自动执行 4 项只读注入，验证判据能变红
# 如无需要可设为 false 关闭（不建议）
selfcheck.enabled=true
