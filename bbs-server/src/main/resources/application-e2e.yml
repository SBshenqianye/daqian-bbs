# E2E 测试环境配置 - 使用独立测试数据库
# 测试库由 run-e2e.ps1 自动从 bbs_db 复制，测试结束后自动清理
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost:3306/bbs_e2e_test?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root

# 测试端口（避免与开发环境 9083 冲突）
server:
  port: 9084
