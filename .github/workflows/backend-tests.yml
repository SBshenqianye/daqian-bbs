name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: 单测 + 开发端口预检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: bbs-server/pom.xml

      - name: Backend unit tests
        working-directory: bbs-server
        run: mvn -B test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dev port precheck tests
        run: node --test tests/dev/check-dev-port.test.js

  api-smoke:
    name: 权限组 API 冒烟（隔离 MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bbs_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: bbs-server/pom.xml

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Initialize isolated schema
        run: >
          mysql -h 127.0.0.1 -P 3306 -uroot -proot bbs_ci_test
          < bbs-server/src/main/resources/db/init/init-mysql.sql

      - name: Build backend
        working-directory: bbs-server
        run: mvn -B -DskipTests package

      - name: Start backend (e2e profile)
        working-directory: bbs-server
        env:
          SPRING_PROFILES_ACTIVE: e2e
          SERVER_PORT: '9084'
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/bbs_ci_test?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
          BBS_STORAGE_PATH: /tmp/bbs-upload-e2e/
        run: |
          nohup java -Dloader.path=target/lib -jar target/bbs-server.jar > /tmp/bbs-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9084/bbs-server/common/saOrgTree >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not start"
          tail -n 150 /tmp/bbs-server.log
          exit 1

      - name: Seed test users
        run: >
          mysql -h 127.0.0.1 -P 3306 -uroot -proot bbs_ci_test
          < tests/fixtures/permission-api-users.sql

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Permission API smoke
        env:
          BBS_E2E_BASE: http://127.0.0.1:9084/bbs-server
          BBS_E2E_DB: bbs_ci_test
        run: node tests/api/permission-group-api-smoke.js

      - name: Stop backend
        if: always()
        run: pkill -f 'bbs-server.jar' || true

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/bbs-server.log
          if-no-files-found: ignore
